<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IC Cashier Citizen's Charter</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#333;
}

.header{

  background:
  linear-gradient(
    135deg,
    #021B3A 0%,
    #003B8E 45%,
    #0057D9 100%
  );

  color:white;

  padding:20px 30px;

  display:flex;

  align-items:center;

  gap:20px;
}

.home-btn{

  text-decoration:none;

  color:white;

  background:rgba(255,255,255,0.15);

  padding:10px 16px;

  border-radius:10px;

  transition:.3s;
}

.home-btn:hover{

  background:rgba(255,255,255,0.25);
}

.container{

  max-width:1400px;

  margin:auto;

  padding:40px 25px;
}

.card{

  background:white;

  border-radius:18px;

  padding:30px;

  box-shadow:
  0 3px 15px rgba(0,0,0,0.08);
}

.section-title{

  color:#003B8E;

  margin-bottom:15px;

  font-size:24px;
}

.description{

  line-height:1.8;

  margin-bottom:25px;
}

.charter-image{

  width:100%;

  height:auto;

  border-radius:12px;

  box-shadow:
  0 3px 15px rgba(0,0,0,0.15);
}

@media(max-width:768px){

  .header{

    flex-direction:column;

    align-items:flex-start;
  }

  .container{

    padding:20px;
  }

}

</style>

</head>

<body>

<div class="header">

  <a href="index.html" class="home-btn">
    ← Home
  </a>

  <h1>IC Cashier Citizen's Charter</h1>

</div>

<div class="container">

  <div class="card">

    <h2 class="section-title">
      Citizen's Charter
    </h2>

    <p class="description">

      The Citizen's Charter contains the service standards,
      requirements, procedures, processing times, and
      responsibilities related to Cashier Section services.

    </p>

    <img
      src="IC CC.jpeg"
      alt="IC Cashier Citizen's Charter"
      class="charter-image">

  </div>

</div>

</body>

</html>
