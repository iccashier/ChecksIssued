<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IC Cashier Monitoring Portal</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial, sans-serif;
      background:#121212;
      color:white;
      overflow:hidden;
    }

    /* LOADING SCREEN */

    #loader{
      position:fixed;
      width:100%;
      height:100%;
      background:#121212;
      display:flex;
      justify-content:center;
      align-items:center;
      z-index:9999;
      flex-direction:column;
    }

    .spinner{
      border:6px solid #333;
      border-top:6px solid #7B61FF;
      border-radius:50%;
      width:60px;
      height:60px;
      animation:spin 1s linear infinite;
      margin-bottom:20px;
    }

    @keyframes spin{
      0%{ transform:rotate(0deg); }
      100%{ transform:rotate(360deg); }
    }

    /* HEADER */

    .header{
      height:70px;
      background:#1E1E1E;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 20px;
      border-bottom:1px solid #2E2E2E;
    }

    .left-header{
      display:flex;
      align-items:center;
    }

    .logo{
      width:50px;
      height:50px;
      margin-right:15px;
      object-fit:contain;
    }

    .title{
      font-size:22px;
      font-weight:bold;
    }

    /* NAVIGATION */

    .nav{
      display:flex;
      gap:10px;
    }

    .nav button{
      padding:10px 15px;
      border:none;
      background:#2E2E2E;
      color:white;
      border-radius:8px;
      cursor:pointer;
      transition:0.3s;
      font-size:14px;
    }

    .nav button:hover{
      background:#7B61FF;
    }

    /* DASHBOARD */

    .iframe-container{
      height:calc(100vh - 70px);
      overflow:hidden;
      background:white;
    }

    iframe{
      width:100vw;
      height:calc(100vh - 70px + 40px);
      border:none;
      background:white;

      margin-bottom:-40px;
    }

    /* MOBILE */

    @media(max-width:768px){

      .header{
        height:auto;
        flex-direction:column;
        align-items:flex-start;
        padding:15px;
        gap:10px;
      }

      .left-header{
        width:100%;
      }

      .logo{
        width:40px;
        height:40px;
      }

      .title{
        font-size:16px;
      }

      .nav{
        width:100%;
        overflow-x:auto;
      }

      .nav button{
        white-space:nowrap;
      }

      .iframe-container{
        height:calc(100vh - 120px);
      }

      iframe{
        height:calc(100vh - 120px + 40px);
      }

    }

  </style>

</head>

<body>

<!-- LOADING -->

<div id="loader">

  <div class="spinner"></div>

  <div>Loading Monitoring Portal...</div>

</div>

<!-- HEADER -->

<div class="header">

  <div class="left-header">

    <img 
      class="logo"
      src="https://www.insurance.gov.ph/wp-content/uploads/2022/01/IC-logo-white-1.png">

    <div class="title">
      IC Cashier Monitoring Portal
    </div>

  </div>

  <!-- NAVIGATION -->

  <div class="nav">

    <button onclick="loadChecksIssued()">
      Checks Issued
    </button>

    <button onclick="loadPCF()">
      Unliquidated PCF CA
    </button>

  </div>

</div>

<!-- DASHBOARD -->

<div class="iframe-container">

<iframe
id="dashboardFrame"
onload="hideLoader()"
src="https://insurancegovph-my.sharepoint.com/personal/rs_nunez_insurance_gov_ph/_layouts/15/Doc.aspx?sourcedoc={8404afc2-e4dc-4752-977f-1a2d695aa547}&action=embedview&wdAllowInteractivity=False&wdHideGridlines=True&wdHideHeaders=True&wdDownloadButton=False">
</iframe>

</div>

<script>

  function hideLoader(){
    document.getElementById("loader").style.display = "none";
  }

  function showLoader(){
    document.getElementById("loader").style.display = "flex";
  }

  function loadChecksIssued(){

    showLoader();

    document.getElementById("dashboardFrame").src =
    "https://insurancegovph-my.sharepoint.com/personal/rs_nunez_insurance_gov_ph/_layouts/15/Doc.aspx?sourcedoc={8404afc2-e4dc-4752-977f-1a2d695aa547}&action=embedview&wdAllowInteractivity=False&wdHideGridlines=True&wdHideHeaders=True&wdDownloadButton=False";

  }

  function loadPCF(){

    showLoader();

    document.getElementById("dashboardFrame").src =
    "https://insurancegovph-my.sharepoint.com/personal/rs_nunez_insurance_gov_ph/_layouts/15/Doc.aspx?sourcedoc={3732ca75-2b7f-4b97-82fd-79c100b519ca}&action=embedview&wdAllowInteractivity=False&wdHideGridlines=True&wdHideHeaders=True&wdDownloadButton=False&ActiveCell='UNLIQUIDATED PCF CA'!A1";

  }

</script>

</body>

</html>
