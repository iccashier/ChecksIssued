<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IC Cashier Monitoring Portal</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  background:#121212;
  color:white;
}

.container{
  display:flex;
  height:100vh;
}

/* SIDEBAR */

.sidebar{
  width:240px;
  background:#1E1E1E;
  padding:20px;
  border-right:1px solid #2E2E2E;
}

.logo{
  width:70px;
  margin-bottom:20px;
}

.title{
  font-size:24px;
  font-weight:bold;
  line-height:1.3;
  margin-bottom:40px;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.nav a{
  text-decoration:none;
}

.nav button{
  width:100%;
  padding:14px;
  border:none;
  background:#2E2E2E;
  color:white;
  border-radius:10px;
  cursor:pointer;
  transition:0.3s;
  font-size:14px;
  text-align:left;
}

.nav button:hover{
  background:#7B61FF;
}

/* CONTENT */

.content{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:40px;
}

.welcome-box{
  max-width:700px;
}

.welcome-box h1{
  font-size:42px;
  margin-bottom:20px;
}

.welcome-box p{
  font-size:18px;
  line-height:1.8;
  color:#D0D0D0;
}

@media(max-width:768px){

  .container{
    flex-direction:column;
  }

  .sidebar{
    width:100%;
    border-right:none;
    border-bottom:1px solid #2E2E2E;
  }

  .content{
    align-items:flex-start;
    padding:30px;
  }

  .welcome-box h1{
    font-size:32px;
  }

}

</style>

</head>

<body>

<div class="container">

  <!-- SIDEBAR -->

  <div class="sidebar">

    <img
      class="logo"
      src="https://www.insurance.gov.ph/wp-content/uploads/2022/01/IC-logo-white-1.png">

    <div class="title">
      IC Cashier Monitoring Portal
    </div>

    <div class="nav">

      <a href="checks-issued.html">
        <button>Checks Issued</button>
      </a>

      <a href="unliquidated-pcf.html">
        <button>Unliquidated PCF CA</button>
      </a>

    </div>

  </div>

  <!-- CONTENT -->

  <div class="content">

    <div class="welcome-box">

      <h1>
        Welcome to IC Cashier Monitoring Portal
      </h1>

      <p>
        This portal serves as the centralized monitoring platform
        for the Cashier Section of the Insurance Commission.
        <br><br>
        Please select a monitoring module from the navigation panel
        to access the corresponding dashboard and reports.
      </p>

    </div>

  </div>

</div>

</body>

</html>
