<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IC Cashier Dashboard</title>

  <!-- AUTO REFRESH -->
  <meta http-equiv="refresh" content="60">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial, sans-serif;
      background:#121212;
      color:white;
      overflow:hidden;
    }

    /* LOADING SCREEN */

    #loader{
      position:fixed;
      width:100%;
      height:100%;
      background:#121212;
      display:flex;
      justify-content:center;
      align-items:center;
      z-index:9999;
      flex-direction:column;
    }

    .spinner{
      border:6px solid #333;
      border-top:6px solid #7B61FF;
      border-radius:50%;
      width:60px;
      height:60px;
      animation:spin 1s linear infinite;
      margin-bottom:20px;
    }

    @keyframes spin{
      0%{ transform:rotate(0deg); }
      100%{ transform:rotate(360deg); }
    }

    /* HEADER */

    .header{
      height:70px;
      background:#1E1E1E;
      display:flex;
      align-items:center;
      padding:0 20px;
      border-bottom:1px solid #2E2E2E;
    }

    .logo{
      width:45px;
      height:45px;
      margin-right:15px;
      border-radius:50%;
      background:white;
      object-fit:contain;
      padding:3px;
    }

    .title{
      font-size:22px;
      font-weight:bold;
    }

    /* DASHBOARD */

    iframe{
      width:100vw;
      height:calc(100vh - 70px);
      border:none;
    }

    /* MOBILE */

    @media(max-width:768px){

      .header{
        height:60px;
        padding:0 15px;
      }

      .logo{
        width:35px;
        height:35px;
      }

      .title{
        font-size:16px;
      }

      iframe{
        height:calc(100vh - 60px);
      }

    }

  </style>

</head>

<body>

<!-- LOADING SCREEN -->

<div id="loader">

  <div class="spinner"></div>

  <div>Loading Dashboard...</div>

</div>

<!-- HEADER -->

<div class="header">

  <img 
    class="logo"
    src="https://upload.wikimedia.org/wikipedia/en/thumb/7/73/Insurance_Commission_%28Philippines%29.svg/512px-Insurance_Commission_%28Philippines%29.svg.png">

  <div class="title">
    IC Cashier Dashboard
  </div>

</div>

<!-- DASHBOARD -->

<iframe
onload="hideLoader()"
src="https://insurancegovph-my.sharepoint.com/personal/rs_nunez_insurance_gov_ph/_layouts/15/Doc.aspx?sourcedoc={8404afc2-e4dc-4752-977f-1a2d695aa547}&action=embedview&wdAllowInteractivity=False&wdHideGridlines=True&wdHideHeaders=True&wdDownloadButton=False">
</iframe>

<script>

  function hideLoader(){
    document.getElementById("loader").style.display = "none";
  }

</script>

</body>

</html>
