<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IC Cashier Monitoring Portal</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial, sans-serif;
      background:#121212;
      overflow:hidden;
    }

    /* LOADING SCREEN */

    #loader{
      position:fixed;
      width:100%;
      height:100%;
      background:#121212;
      display:flex;
      justify-content:center;
      align-items:center;
      z-index:9999;
      flex-direction:column;
      color:white;
    }

    .spinner{
      border:6px solid #333;
      border-top:6px solid #7B61FF;
      border-radius:50%;
      width:60px;
      height:60px;
      animation:spin 1s linear infinite;
      margin-bottom:20px;
    }

    @keyframes spin{
      0%{ transform:rotate(0deg); }
      100%{ transform:rotate(360deg); }
    }

    /* MAIN LAYOUT */

    .container{
      display:flex;
      height:100vh;
    }

    /* SIDEBAR */

    .sidebar{
      width:220px;
      background:#1E1E1E;
      border-right:1px solid #2E2E2E;
      padding:20px;
      display:flex;
      flex-direction:column;
    }

    /* BRANDING */

    .branding{
      margin-bottom:30px;
    }

    .logo{
      width:60px;
      margin-bottom:15px;
    }

    .title{
      color:white;
      font-size:26px;
      font-weight:bold;
      line-height:1.3;
    }

    /* NAVIGATION */

    .nav{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .nav button{
      width:100%;
      padding:14px;
      border:none;
      background:#2E2E2E;
      color:white;
      border-radius:10px;
      cursor:pointer;
      transition:0.3s;
      font-size:14px;
      text-align:left;
    }

    .nav button:hover{
      background:#7B61FF;
    }

    /* DASHBOARD AREA */

    .dashboard{
      flex:1;
      overflow:hidden;
      background:white;

      display:flex;
      align-items:flex-start;
      justify-content:flex-start;
    }

    iframe{
      width:100%;
      height:calc(100vh + 120px);
      border:none;

      margin-bottom:-120px;
    }

    /* MOBILE */

    @media(max-width:768px){

      .container{
        flex-direction:column;
      }

      .sidebar{
        width:100%;
        height:auto;
        border-right:none;
        border-bottom:1px solid #2E2E2E;
      }

      .title{
        font-size:20px;
      }

      .nav{
        flex-direction:row;
        overflow-x:auto;
      }

      .nav button{
        min-width:200px;
      }

      iframe{
        height:calc(100vh + 120px);
      }

    }

  </style>

</head>

<body>

<!-- LOADING -->

<div id="loader">

  <div class="spinner"></div>

  <div>Loading Monitoring Portal...</div>

</div>

<div class="container">

  <!-- SIDEBAR -->

  <div class="sidebar">

    <!-- BRANDING -->

    <div class="branding">

      <img 
        class="logo"
        src="https://www.insurance.gov.ph/wp-content/uploads/2022/01/IC-logo-white-1.png">

      <div class="title">
        IC Cashier Monitoring Portal
      </div>

    </div>

    <!-- NAVIGATION -->

    <div class="nav">

      <button onclick="loadChecksIssued()">
        Checks Issued
      </button>

      <button onclick="loadPCF()">
        Unliquidated PCF CA
      </button>

    </div>

  </div>

  <!-- DASHBOARD -->

  <div class="dashboard">

    <iframe
    id="dashboardFrame"
    onload="hideLoader()"
    src="https://insurancegovph-my.sharepoint.com/personal/rs_nunez_insurance_gov_ph/_layouts/15/Doc.aspx?sourcedoc={8404afc2-e4dc-4752-977f-1a2d695aa547}&action=embedview&wdAllowInteractivity=False&wdHideGridlines=True&wdHideHeaders=True&wdDownloadButton=False">
    </iframe>

  </div>

</div>

<script>

  function hideLoader(){
    document.getElementById("loader").style.display = "none";
  }

  function showLoader(){
    document.getElementById("loader").style.display = "flex";
  }

  function loadChecksIssued(){

    showLoader();

    document.getElementById("dashboardFrame").src =
    "https://insurancegovph-my.sharepoint.com/personal/rs_nunez_insurance_gov_ph/_layouts/15/Doc.aspx?sourcedoc={8404afc2-e4dc-4752-977f-1a2d695aa547}&action=embedview&wdAllowInteractivity=False&wdHideGridlines=True&wdHideHeaders=True&wdDownloadButton=False";

  }

  function loadPCF(){

    showLoader();

    document.getElementById("dashboardFrame").src =
    "https://insurancegovph-my.sharepoint.com/personal/rs_nunez_insurance_gov_ph/_layouts/15/Doc.aspx?sourcedoc={3732ca75-2b7f-4b97-82fd-79c100b519ca}&action=embedview&wdAllowInteractivity=False&wdHideGridlines=True&wdHideHeaders=True&wdDownloadButton=False&ActiveCell='UNLIQUIDATED PCF CA'!A1";

  }

</script>

</body>

</html>
